# rub
name: Generate GitHub Contribution Animation

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          npm install -g puppeteer playwright
          
      - name: Generate contribution animation
        env:
          GITHUB_TOKEN: ${{ secrets.GT_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          mkdir -p output
          node generate-animation.js
          
      - name: Commit and push if changed
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add output/
          git diff --staged --quiet || git commit -m "Update contribution animation"
          git push
