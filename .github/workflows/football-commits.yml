# .github/workflows/football-commits.yml
name: Generate Football Commits

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  push:
    branches: [ main, master ]  # Support both branch names
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write  # Allow the action to write to the repository

jobs:
  generate-football:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GH_TOKEN }}
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        pip install requests pillow python-dotenv
        
    - name: Generate Football Field
      env:
        GITHUB_TOKEN: ${{ secrets.GT_TOKEN }}
        USERNAME: ${{ github.repository_owner }}
      run: python scripts/generate_football.py
      
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add assets/football-commits.png
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update football commits visualization"
          git push
        fi
